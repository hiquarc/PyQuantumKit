[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquantumkit"
version = "0.2.0"
description = "A tool to develop cross-platform high-level quantum programs using Python's syntax."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Peixun Long", email = "longpx@ihep.ac.cn"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["quantum"]
dependencies = [
    "numpy>=1.22.0",
    "sympy>=1.8",
    "packaging>=20.0",
]
requires-python = ">=3.8"

[tool.setuptools]
license-files = []

[project.optional-dependencies]
qiskit = ["qiskit","qiskit-aer"]
pyqpanda3 = ["pyqpanda3"]
quafu = ["pyquafu"]
cqlib = ["cqlib"]

[project.urls]
Homepage = "https://pyquantumkit.readthedocs.io/"
Repository = "https://github.com/hiquarc/PyQuantumKit"
Documentation = "https://github.com/hiquarc/PyQuantumKit"

[tool.setuptools.packages.find]
include = ["pyquantumkit*"]

[tool.setuptools.package-data]
"pyquantumkit" = ["init_frame.txt"]
